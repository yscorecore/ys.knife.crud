name: Release

# 发布触发：
#   1) v*                        —— 全仓统一版本 tag（首次 v0.0.1，5 个包同版本发布）
#   2) @ys-knife-crud/<pkg>@x.y.z —— 单包发布：在包目录执行 pnpm version patch
#                                   （tag 前缀见各包 .npmrc 的 tag-version-prefix），
#                                   postversion 钩子自动 push commit 与 tag
#
# 认证方式：npm Trusted Publisher（通过 GitHub OIDC 自动认证，无需 NPM_TOKEN）
#           在 npm 网站为每个包配置 Trusted Publisher（仓库 + workflow 文件名），
#           CI 发布时 npm CLI 自动通过 GitHub OIDC 完成认证，不需要 NPM_TOKEN secret。
on:
  push:
    tags:
      - "v*"
      - "@ys-knife-crud/*"

permissions:
  contents: read
  # Trusted Publisher 通过 GitHub OIDC 认证，id-token: write 是必须的
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 仓库 .npmrc 使用国内镜像（npmmirror）加速本地安装，但 GitHub runner 在境外，
    # 访问该镜像经常超时导致安装失败，CI 内强制走官方源
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # registry-url 让 setup-node 写入 .npmrc，Trusted Publisher 通过 OIDC 自动认证
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        # demo 是私有应用不发布，只构建 5 个库包
        run: pnpm -r --filter "!@ys-knife-crud/element-plus-demo" run build

      - name: Publish to npm
        # 逐包发布（按依赖拓扑顺序）：单个包失败不会中断其余包，且把错误摘要写入
        # check-run 注解，便于无需登录也能排查失败原因。
        # publishConfig 中的 registry/provenance/access 覆盖 .npmrc 镜像源并启用 OIDC 认证
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for pkg in core vue export-exceljs import-exceljs react taro element-plus antd; do
            echo "::group::publish @ys-knife-crud/$pkg"
            if out=$(pnpm --filter "@ys-knife-crud/$pkg" publish --access public --no-git-checks 2>&1); then
              echo "$out" | tail -8
            elif echo "$out" | grep -qiE "previously published|EPUBLISHCONFLICT|already published"; then
              echo "skip @ys-knife-crud/$pkg: 该版本已发布"
            else
              echo "$out" | tail -40
              msg=$(echo "$out" | grep -iE "npm error|npm ERR|ERR_|error" | tail -6 | tr '\n' ' ' | cut -c1-900)
              echo "::error title=publish @ys-knife-crud/$pkg 失败::$msg"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
