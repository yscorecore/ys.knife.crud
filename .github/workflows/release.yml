name: Release

# 发布触发：
#   1) v*                        —— 全仓统一版本 tag（首次 v0.0.1，5 个包同版本发布）
#   2) @ys-knife-crud/<pkg>@x.y.z —— 单包发布：在包目录执行 pnpm version patch
#                                   （tag 前缀见各包 .npmrc 的 tag-version-prefix），
#                                   postversion 钩子自动 push commit 与 tag
#
# 认证方式：NPM_TOKEN（Classic Automation 类型，专为 CI 设计，自动豁免 2FA）
#           首次发布须在本地手动 npm publish 创建包，之后由本 workflow 后续发布。
#           之所以需要本地首发：npm 包首次发布时 2FA 不可绕过、新包名注册等场景
#           只能在交互式终端完成；包一旦创建，CI 即可用 Automation token 续发新版本。
on:
  push:
    tags:
      - "v*"
      - "@ys-knife-crud/*"

permissions:
  contents: read
  # npm provenance（来源证明）需要向 Sigstore 换取 OIDC 签名
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # registry-url 让 setup-node 写入 .npmrc 模板：
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 下面的 Publish 步骤注入 NODE_AUTH_TOKEN env 后，npm CLI 自动读取
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        # demo 是私有应用不发布，只构建 5 个库包
        run: pnpm -r --filter "!@ys-knife-crud/element-plus-demo" run build

      - name: Publish to npm
        # -r 递归发布：private 包自动跳过；已发布过的版本 pnpm 会自动跳过（单包 tag 也安全）
        # workspace:* 依赖在发布时自动替换为具体版本号；--provenance 生成来源证明
        # 1) pnpm config set 把 token 写入用户级 ~/.npmrc（pnpm 9 最终委托 npm CLI 发布，二者共用）
        # 2) NPM_CONFIG_REGISTRY 强制官方源，覆盖仓库根 .npmrc 的 npmmirror 镜像
        run: |
          pnpm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          pnpm -r publish --access public --no-git-checks --provenance
        env:
          # npm Automation Token，在仓库 Settings → Secrets and variables → Actions 配置
          # 必须是 Automation 类型：Publish token 在 2FA 账号会强制 OTP，CI 无法输入
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
