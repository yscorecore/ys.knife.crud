name: Release

# 发布触发：
#   1) v*                        —— 全仓统一版本 tag（首次 v0.0.1，5 个包同版本发布）
#   2) @ys-knife-crud/<pkg>@x.y.z —— 单包发布：在包目录执行 pnpm version patch
#                                   （tag 前缀见各包 .npmrc 的 tag-version-prefix），
#                                   postversion 钩子自动 push commit 与 tag
#
# 认证方式：npm Trusted Publisher（通过 GitHub OIDC 自动认证，无需 NPM_TOKEN）
#           在 npm 网站为每个包配置 Trusted Publisher（仓库 + workflow 文件名），
#           CI 发布时 npm CLI 自动通过 GitHub OIDC 完成认证，不需要 NPM_TOKEN secret。
on:
  push:
    tags:
      - "v*"
      - "@ys-knife-crud/*"

permissions:
  contents: read
  # Trusted Publisher 通过 GitHub OIDC 认证，id-token: write 是必须的
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # registry-url 让 setup-node 写入 .npmrc，Trusted Publisher 通过 OIDC 自动认证
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        # demo 是私有应用不发布，只构建 5 个库包
        run: pnpm -r --filter "!@ys-knife-crud/element-plus-demo" run build

      - name: Publish to npm
        # -r 递归发布：private 包自动跳过；已发布过的版本 pnpm 会自动跳过（单包 tag 也安全）
        # workspace:* 依赖在发布时自动替换为具体版本号
        # NPM_CONFIG_REGISTRY 强制官方源，覆盖仓库根 .npmrc 的 npmmirror 镜像
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
