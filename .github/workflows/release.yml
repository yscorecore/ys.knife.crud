name: Release

# 发布触发：
#   1) v*                        —— 全仓统一版本 tag（首次 v0.0.1，5 个包同版本发布）
#   2) @ys-knife-crud/<pkg>@x.y.z —— 单包发布：在包目录执行 pnpm version patch
#                                   （tag 前缀见各包 .npmrc 的 tag-version-prefix），
#                                   postversion 钩子自动 push commit 与 tag
#
# 认证方式：npm Trusted Publishing（OIDC）—— 不使用长期 token，
# GitHub Actions 运行时通过 OIDC 向 npm 证明身份，npm 验证通过后允许本次发布。
# 配置前提：在 npm 后台为每个包配置 trusted publisher
#           （repository=yscorecore/ys.knife.crud，workflow=.github/workflows/release.yml，
#            environment=release）。已配置的包发布时不需 NPM_TOKEN secret。
on:
  push:
    tags:
      - "v*"
      - "@ys-knife-crud/*"

permissions:
  contents: read
  # npm Trusted Publishing / provenance 需要向 Sigstore 换取 OIDC 签名
  id-token: write

# 与 npm 后台 Trusted Publisher 配置中的 environment 字段保持一致；
# 显式声明 environment 触发 OIDC 主体claim，使 npm 能精确校验本次发布归属
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 注意：不再设置 registry-url，也不再写 .npmrc token，
          # 让 npm CLI 走 OIDC（Trusted Publishing）路径
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        # demo 是私有应用不发布，只构建 5 个库包
        run: pnpm -r --filter "!@ys-knife-crud/element-plus-demo" run build

      - name: Publish to npm
        # Trusted Publishing：npm CLI 检测到 OIDC 环境（id-token: write + environment）后，
        # 自动与 npm 注册表交换身份证明，无需任何 token；--provenance 生成来源证明
        # -r 递归发布：private 包自动跳过；已发布过的版本 pnpm 会自动跳过（单包 tag 也安全）
        # workspace:* 依赖在发布时自动替换为具体版本号
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          # 强制官方源，覆盖仓库根 .npmrc 的 npmmirror 镜像（OIDC 必须用 npmjs.org）
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
